[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "top-report-scraper"
version = "0.1.0"
description = "CLI client for the Trial TOP Report APIs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
top-report = "top_report_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

