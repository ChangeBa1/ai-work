[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnc-agent"
version = "0.1.0"
description = "VNC black-box GUI automation testing core execution loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "vncdotool",
  "opencv-python",
  "numpy",
  "rapidocr-onnxruntime",
  "httpx",
  "pydantic>=2",
  "pydantic-settings",
  "PyYAML",
  "SQLAlchemy>=2",
  "aiosqlite",
  "structlog",
  "typer",
  "jinja2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[project.scripts]
vnc-agent = "vnc_agent.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
  "ignore::DeprecationWarning",
]
python_classes = ["Test*", "Describe*"]
# Avoid collecting domain models named TestCase / TestRun / TestStep
norecursedirs = [".git", ".venv", "venv", "data", "artifacts"]
markers = [
  "performance: fixed-workload local benchmarks (feature 004); excluded by default, run with -m performance",
]
addopts = "-m \"not performance\""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
