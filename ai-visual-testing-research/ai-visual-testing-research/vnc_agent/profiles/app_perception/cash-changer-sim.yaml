# App-perception profile: cash-changer simulator tool window.
#
# Second, deliberately UNRELATED window shape, used to prove the core carries
# no window-shape prior (Constitution VI cross-scenario requirement):
# 634x448, aspect 1.42 (wide) versus scanner-sim's 423x581, aspect 0.73 (tall).
#
# Drafted with scripts/gen_app_profile_from_designer.py, then hand-reviewed.

name: cash-changer-sim
description: >-
  Cash-changer simulator tool window. Design-time title: CashChanger.
  Wide/short (634x448, aspect 1.42) — the shape counterpart to scanner-sim.

# Reviewed: kanji anchors read reliably with the deployed OCR model.
# Deliberately NOT using the "合計" label that also exists here: that same
# text appears on the main screen behind the window, and an anchor that also
# occurs outside would drag the union off-window (README rule 2).
required_anchors:
  - "状態"
  - "釣銭機状態"
  - "自動預り金"
  - "預り金通知"
min_required_anchor_hits: 4
title_anchor: "CashChanger"

# The anchor union only spans x 0.02..0.62 and y 0.03..0.43 of the client
# area (everything below is an unlabelled log box), so this window needs much
# larger padding than scanner-sim — which is precisely why padding is
# per-profile data and not a core constant.
padding_ratio:
  left: 0.03
  right: 0.62
  top: 0.09
  bottom: 1.37

aspect_ratio_range: [1.05, 1.90]
area_ratio_range: [0.10, 0.80]
min_size_px: 140

source_geometry:
  client_size: [634, 448]
  controls:
    - name: lblState
      text: "状態"
      rect: [12, 15, 41, 27]
      anchors: [top, left]
    - name: lblCashChangerStatus
      text: "釣銭機状態"
      rect: [325, 15, 390, 27]
      anchors: [top, left]
    - name: chkAutoDeposit
      text: "自動預り金"
      rect: [223, 48, 303, 64]
      anchors: [top, left]
    - name: btnDepNotify
      text: "預り金通知"
      rect: [163, 171, 238, 194]
      anchors: [top, left]
    - name: btnRestore
      text: "復旧"
      rect: [213, 10, 288, 33]
      anchors: [top, left]
