id: generic-precondition-example-001
name: 通用声明式前置条件示例（测试专用，非真实业务用例）
mode: explicit
target_id: win10-test-01
timeout_seconds: 60

precondition:
  facts:
    - key: cart_item_count
      spec:
        operator: all
        conditions:
          - type: text_appears
            value: "0"
    - key: cart_amount
      spec:
        operator: all
        conditions:
          - type: text_appears
            value: "0"

steps:
  - id: press-escape
    name: 按下 escape 键
    intent: press escape
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""
