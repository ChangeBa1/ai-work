id: generic-declarative-interface-example-001
name: 通用声明式前置条件与 tag 审计端到端示例（测试专用，非真实业务用例）
mode: explicit
target_id: win10-test-01
timeout_seconds: 60

# Feature 003 (FR-024): declared as a generic named fact — no fixed
# business schema, evaluated via the same VerificationSpec engine used for
# step assertions below.
precondition:
  facts:
    - key: panel_state
      spec:
        operator: all
        conditions:
          - type: text_appears
            value: "ready"

# Feature 003 (FR-027): declarative, testcase-supplied audit tags — core
# hardcodes no fixed category. Deliberately unrelated to the POS scenario's
# tag vocabulary (add_to_bag/subtotal), proving a second, independent
# declaration of the same generic mechanism.
action_tags:
  - tag: primary_action
    matcher:
      target_role: button
  - tag: keyboard_action
    matcher:
      action_type: press_key

steps:
  - id: open-panel
    name: 打开设置面板
    intent: click the open panel button
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""

  - id: confirm-default
    name: 确认默认值
    intent: press escape to confirm and close
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""
