id: generic-batch-repeat-key-example-001
name: 通用批量重复按键端到端示例（测试专用，非真实业务用例）
mode: explicit
target_id: win10-test-01
timeout_seconds: 60

# Feature 005: a generic, business-agnostic scenario declaring
# batch_repeat_key on a single field — deliberately unrelated to the POS/
# ScannerSimulator scenario (testcases/pos-scan-magazine-checkout.yaml),
# which is the second, unrelated scenario for the Constitution Principle VI
# >=2-scenario proof of this generic capability.
steps:
  - id: clear-generic-field
    name: 清空通用输入框
    intent: 一次性清空当前输入框：连续发送 5 次 Backspace。
    batch_repeat_key:
      key: backspace
      count: 5
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""
