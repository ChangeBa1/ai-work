id: generic-form-flow-001
name: 通用表单流程端到端示例（测试专用，非真实业务用例）
mode: explicit
target_id: win10-test-01
timeout_seconds: 60

steps:
  - id: fill-field
    name: 填写输入框
    intent: type the value into the text field
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""

  - id: submit-form
    name: 提交表单
    intent: press enter to submit the form
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""
