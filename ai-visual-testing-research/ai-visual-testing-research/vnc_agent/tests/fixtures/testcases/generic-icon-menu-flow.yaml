id: generic-icon-menu-flow-001
name: 通用图标菜单流程端到端示例（测试专用，非真实业务用例）
mode: explicit
target_id: win10-test-01
timeout_seconds: 60

steps:
  - id: open-icon-menu
    name: 打开图标菜单
    intent: click the toolbar icon to open the overlay menu
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""

  - id: select-menu-item
    name: 选择菜单项
    intent: click the highlighted menu item in the overlay
    verification_mode: effect_only
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""
