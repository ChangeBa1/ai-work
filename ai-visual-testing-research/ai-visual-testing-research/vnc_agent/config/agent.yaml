# Default agent runtime configuration (data-model.md §11)

step:
  default_timeout_seconds: 60
  default_max_retries: 3

wait:
  min_delay_ms: 300
  max_delay_ms: 20000
  capture_interval_ms: 500
  stable_frame_count: 3
  pixel_diff_threshold: 0.02

perception:
  ocr_enabled: true
  template_enabled: true
  vision_fallback_enabled: true
  # Feature 010: this deployment tests a Japanese-language GUI — use the
  # Japanese PP-OCRv4 recognition model (provenance: models/ocr/README.md).
  # Remove/override these three keys for other deployments; unset = the
  # engine's bundled default recognition model.
  ocr_lang: japan
  ocr_rec_model_path: models/ocr/japan_PP-OCRv4_rec_mobile.onnx
  ocr_rec_keys_path: models/ocr/japan_dict.txt
  # 002-action-effect-verification
  error_keywords:
    - "错误"
    - "エラー"
    - "Error"
    - "失败"
    - "失敗"
    - "Failed"
  local_blob_min_ratio: 0.0005
  # Feature 004: bounded analysis-cache window (3..5 most-recent logical frames)
  cache_max_frames: 5

artifacts:
  screenshot_policy: "all"  # step | all | on_failure
  root_dir: "artifacts"
  db_path: "data/vnc_agent.db"

security:
  mask_regions: []  # list of [x1, y1, x2, y2]
  sensitive_field_names:
    - password
    - api_key
    - secret
    - token

# Grounding confidence thresholds (research.md §11 — defaults for implementation)
grounding:
  overall_confidence_threshold: 0.55
  top1_top2_min_gap: 0.08

# Feature 011: step-verification arbitration (revised FR-010, spec 011).
# Minimum confidence of the re-checked visual_question "passed" answer required
# before a deterministic failed built solely from weak-negative OCR misses
# (text_appears not found) may be overridden. Range [0, 1]; raise to tighten,
# 1.0 effectively disables the override.
verification:
  visual_override_confidence_threshold: 0.8

# Action-level timeouts
action:
  default_timeout_seconds: 10

# Feature 013 (safe-click-point): click-point geometry. edge_inset_ratio is the
# per-side inset defining the safe zone inside a target bbox (overall_design.md
# §9.6 — avoid the outer 15%); valid range [0, 0.5).
click:
  edge_inset_ratio: 0.15

planning:
  ocr_sanity_check_ratio: 0.10
  # Feature 012: minimum OCR confidence for a unique OCR hit to be clicked
  # directly (suspicion rule R-B). Hits below this fall through to MiMo
  # Grounding with the hit passed along as an ocr_candidates hint. Range
  # [0, 1]; raise to be more conservative (more grounding calls), lower to
  # trust OCR more. Kept stricter than grounding.overall_confidence_threshold
  # because a direct click relies on a single piece of OCR evidence.
  ocr_direct_click_min_confidence: 0.85
  # Feature 003 (safety issue A): spatial-conflict threshold, generic geometry
  target_region_conflict_iou_threshold: 0.10
  # Feature 003 (safety issue B): generic UI-interaction risk categories, not
  # business vocabulary — deployments MAY override per-category.
  micro_action_risk_thresholds:
    dismiss_overlay: medium
    scroll_reveal: medium
    refocus: medium
    wait: high
    re_observe: high

reporting:
  # Feature 003: core no longer hardcodes any business category. Testcases/
  # scenario profiles declare their own tags (domain/testcase.py::
  # TestCase.action_tags); core default is an empty list.
  action_tags: []
  # Feature 004: zh-CN is the default and only required resource bundle;
  # unregistered locales fail at config load (report-contract.md).
  locale: zh-CN

# Feature 015 (page-element-memory): page/element memory for the grounding
# hot path (overall_design.md §12/§13/§21.3). enabled: false restores the
# pre-015 behavior byte-for-byte. Thresholds follow §13 (high => direct use
# of remembered experience, medium => grounder hint only, low => reference).
memory:
  enabled: true
  page_match_high: 0.88
  page_match_medium: 0.72
  page_match_low: 0.55
  # Minimum neighborhood template-match score for a direct memory click.
  template_match_threshold: 0.85
  # Per-side search-window expansion around the remembered bbox (x its size).
  bbox_expand_ratio: 0.5
  max_elements_per_page: 64
  # Template image refresh requires this many consecutive verified successes.
  template_refresh_min_consecutive_successes: 3
  # null => "<artifacts.root_dir>/memory/templates"
  storage_dir: null

# Feature 016 (record-replay): trajectory recording after a fully-passed
# exploration run + replay-mode execution (overall_design.md §10.2/§11).
# patch_auto_apply is intentionally inert in this MVP (ADR-005: self-heal
# candidates require human review; true only logs a warning).
replay:
  enabled: true
  auto_generate: true
  patch_auto_apply: false
  # Replay-stage template-locate threshold (independent of memory's).
  template_match_threshold: 0.85
  # Per-side search-window expansion around the recorded bbox (x its size).
  bbox_expand_ratio: 0.5
  # Minimum page-fingerprint tier for direct locate: high (design default)
  # or medium (explicitly relaxed; independent verification still gates).
  min_page_match_level: high
  # Max per-axis disagreement between matched anchor offsets (px).
  anchor_offset_tolerance_px: 8
  # null => "<artifacts.root_dir>/replay/templates"
  storage_dir: null

# Recovery Tier-2 budgets per FailureType (data-model.md §8/§11)
recovery:
  vnc_connect_failed:
    max_retries: 3
    cooldown_ms: 1000
    consumes_global_retry_budget: true
    allows_action_path_change: false
    requires_strong_model: false
    requires_human_confirmation: false
  vnc_disconnected:
    max_retries: 1
    cooldown_ms: 500
    consumes_global_retry_budget: true
    allows_action_path_change: false
    requires_strong_model: false
    requires_human_confirmation: false
  black_screen:
    max_retries: 2
    cooldown_ms: 500
    consumes_global_retry_budget: true
    allows_action_path_change: false
    requires_strong_model: false
    requires_human_confirmation: false
  page_not_stable:
    max_retries: 2
    cooldown_ms: 1000
    consumes_global_retry_budget: true
    allows_action_path_change: false
    requires_strong_model: false
    requires_human_confirmation: false
  target_not_found:
    max_retries: 2
    cooldown_ms: 300
    consumes_global_retry_budget: true
    allows_action_path_change: true
    requires_strong_model: false
    requires_human_confirmation: false
  grounding_low_confidence:
    max_retries: 2
    cooldown_ms: 300
    consumes_global_retry_budget: true
    allows_action_path_change: true
    requires_strong_model: false
    requires_human_confirmation: false
  action_no_effect:
    max_retries: 2
    cooldown_ms: 300
    consumes_global_retry_budget: true
    allows_action_path_change: true
    requires_strong_model: false
    requires_human_confirmation: false
  focus_error:
    max_retries: 2
    cooldown_ms: 200
    consumes_global_retry_budget: true
    allows_action_path_change: true
    requires_strong_model: false
    requires_human_confirmation: false
  input_method_error:
    max_retries: 2
    cooldown_ms: 200
    consumes_global_retry_budget: true
    allows_action_path_change: true
    requires_strong_model: false
    requires_human_confirmation: false
  unexpected_dialog:
    max_retries: 2
    cooldown_ms: 300
    consumes_global_retry_budget: true
    allows_action_path_change: false
    requires_strong_model: false
    requires_human_confirmation: false
  verification_failed:
    max_retries: 2
    cooldown_ms: 500
    consumes_global_retry_budget: true
    allows_action_path_change: false
    requires_strong_model: false
    requires_human_confirmation: false
  timeout:
    max_retries: 1
    cooldown_ms: 200
    consumes_global_retry_budget: true
    allows_action_path_change: true
    requires_strong_model: false
    requires_human_confirmation: false
  # Feature 014: zoom_reground escalation (specs/014-target-not-found-zoom-recovery)
  # — crop + upscale + re-OCR + re-ground when full-screen grounding keeps
  # failing after recapture. Not a per-FailureType policy: extracted into
  # AgentConfig.zoom_reground at load time. max_per_step: 0 disables it.
  zoom_reground:
    max_per_step: 1
    scale_factor: 2.0
    roi_expand_factor: 2.0
    min_roi_size_px: 64
