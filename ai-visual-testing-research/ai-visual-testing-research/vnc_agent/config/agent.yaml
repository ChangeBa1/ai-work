# Default agent runtime configuration (data-model.md §11)

step:
  default_timeout_seconds: 60
  default_max_retries: 3

wait:
  min_delay_ms: 300
  max_delay_ms: 20000
  capture_interval_ms: 500
  stable_frame_count: 3
  pixel_diff_threshold: 0.02

perception:
  ocr_enabled: true
  template_enabled: true
  vision_fallback_enabled: true
  # 002-action-effect-verification
  error_keywords:
    - "错误"
    - "エラー"
    - "Error"
    - "失败"
    - "失敗"
    - "Failed"
  local_blob_min_ratio: 0.0005

artifacts:
  screenshot_policy: "all"  # step | all | on_failure
  root_dir: "artifacts"
  db_path: "data/vnc_agent.db"

security:
  mask_regions: []  # list of [x1, y1, x2, y2]
  sensitive_field_names:
    - password
    - api_key
    - secret
    - token

# Grounding confidence thresholds (research.md §11 — defaults for implementation)
grounding:
  overall_confidence_threshold: 0.55
  top1_top2_min_gap: 0.08

# Action-level timeouts
action:
  default_timeout_seconds: 10

# Recovery Tier-2 budgets per FailureType (data-model.md §8/§11)
recovery:
  vnc_connect_failed:
    max_retries: 3
    cooldown_ms: 1000
  vnc_disconnected:
    max_retries: 1
    cooldown_ms: 500
  black_screen:
    max_retries: 2
    cooldown_ms: 500
  page_not_stable:
    max_retries: 2
    cooldown_ms: 1000
  target_not_found:
    max_retries: 2
    cooldown_ms: 300
  grounding_low_confidence:
    max_retries: 2
    cooldown_ms: 300
  action_no_effect:
    max_retries: 2
    cooldown_ms: 300
  focus_error:
    max_retries: 2
    cooldown_ms: 200
  input_method_error:
    max_retries: 2
    cooldown_ms: 200
  unexpected_dialog:
    max_retries: 2
    cooldown_ms: 300
  verification_failed:
    max_retries: 2
    cooldown_ms: 500
  timeout:
    max_retries: 1
    cooldown_ms: 200
