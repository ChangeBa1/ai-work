id: pos-buy-bag-checkout-001
name: 购买一个购物袋并计算合计
mode: explicit
target_id: win10-test-01
timeout_seconds: 180

steps:
  - id: add-shopping-bag
    name: 加入购物袋商品
    intent: 点击"レジ袋"（购物袋）按钮，将一个购物袋商品加入购物车
    max_retries: 2
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""

  - id: calc-subtotal
    name: 计算合计金额
    intent: 点击"小計"（小计）按钮，计算本次购买的合计金额
    max_retries: 2
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""
