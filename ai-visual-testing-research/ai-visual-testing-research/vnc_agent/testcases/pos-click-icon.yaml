id: pos-click-round-icon-001
name: 点击右上角圆形图标按钮（视觉定位路径）
mode: explicit
target_id: win10-test-01
timeout_seconds: 120

steps:
  - id: click-round-icon
    name: 点击右上角圆形头像图标
    intent: >
      屏幕右上角"合计"数字区域左侧、副屏顶部有一个灰色圆形图标按钮，没有任何文字标签，
      看起来像是用户/头像图标。请点击这个圆形图标按钮。
    max_retries: 2
    expected:
      operator: all
      conditions:
        - type: screen_changed
          value: ""
